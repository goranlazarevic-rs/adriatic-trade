name: Adriatic Trade Release Gate
# PRs and pushes only validate. Production requires manual dispatch and owner approval.

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "worker/adriatic-trade-worker-v4.5.0.js"
      - "assets/js/admin.js"
      - "assets/js/main.js"
      - ".github/workflows/deploy-worker.yml"
      - "tests/**"
      - "scripts/check-worker-release.sh"
      - "cloudflare-d1-schema-v1.sql"
      - "admin.html"
      - "checkout.html"
      - "dostava-placanje.html"
      - "uslovi-kupovine.html"
      - "dokumenti/**"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "worker/adriatic-trade-worker-v4.5.0.js"
      - "assets/js/admin.js"
      - "assets/js/main.js"
      - ".github/workflows/deploy-worker.yml"
      - "tests/**"
      - "scripts/check-worker-release.sh"
      - "cloudflare-d1-schema-v1.sql"
      - "admin.html"
      - "checkout.html"
      - "dostava-placanje.html"
      - "uslovi-kupovine.html"
      - "dokumenti/**"
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Request production deployment (requires separate owner approval)"
        type: boolean
        required: true
        default: false
      approved_sha:
        description: "Full 40-character main commit SHA approved for production; blank for validation only"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate production deployment request
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: bash scripts/check-worker-release.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Regression tests
        run: |
          node tests/admin-operations.mjs
          node tests/local-delivery.mjs
          node tests/notification-outbox.mjs
          node tests/checkout-security.mjs

      - name: Install isolated integration test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/qa" --no-audit --no-fund miniflare@5.20261006.1-alpha playwright@1.62.1 yaml@2.8.1
          "$RUNNER_TEMP/qa/node_modules/.bin/playwright" install --with-deps chromium

      - name: Release gate policy regressions
        run: YAML_MODULE_PATH="$RUNNER_TEMP/qa/node_modules/yaml" node tests/release-gate.mjs

      - name: Cloudflare runtime and browser regressions
        run: |
          MINIFLARE_MODULE_PATH="$RUNNER_TEMP/qa/node_modules/miniflare" node tests/cloudflare-runtime.mjs
          PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/qa/node_modules/playwright" node tests/local-delivery-browser.mjs

      - name: Validate JavaScript syntax
        run: |
          node --check worker/adriatic-trade-worker-v4.5.0.js
          node --check assets/js/admin.js

      - name: Validate release version and required bindings
        run: |
          WORKER_VERSION=$(sed -n 's/.*version: "\([0-9.]*\)".*/\1/p' worker/adriatic-trade-worker-v4.5.0.js | head -n 1)
          DEPLOY_VERSION=$(sed -n 's/^[[:space:]]*- name: Deploy Worker v\([0-9.]*\)$/\1/p' .github/workflows/deploy-worker.yml | head -n 1)
          HEALTH_VERSION=$(grep 'jq -e.*\.version ==' .github/workflows/deploy-worker.yml | sed -n 's/.*\.version == "\([0-9.]*\)".*/\1/p' | head -n 1)
          test -n "$WORKER_VERSION"
          test "$WORKER_VERSION" = "$DEPLOY_VERSION"
          test "$WORKER_VERSION" = "$HEALTH_VERSION"
          grep -q 'binding: "DB"' .github/workflows/deploy-worker.yml
          grep -q 'binding: "RECEIPTS"' .github/workflows/deploy-worker.yml
          grep -q 'TURNSTILE_SITE_KEY' .github/workflows/deploy-worker.yml
          grep -q 'crons: \["\*/5 \* \* \* \*"\]' .github/workflows/deploy-worker.yml

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
    needs: validate
    environment:
      name: worker-production
    runs-on: ubuntu-latest
    concurrency:
      group: adriatic-trade-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Recheck approved revision after environment approval
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: bash scripts/check-worker-release.sh

      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Discover existing D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")
          DB_ID=$(printf '%s' "$RESPONSE" | jq -r '.result[] | select(.name == "adriatic-trade-orders-db") | (.uuid // .id)' | head -n 1)
          test -n "$DB_ID"
          test "$DB_ID" != "null"
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Create deployment configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          jq -n \
            --arg account_id "$CLOUDFLARE_ACCOUNT_ID" \
            --arg database_id "$D1_DATABASE_ID" \
            '{
              name: "adriatic-trade-orders",
              main: "worker/adriatic-trade-worker-v4.5.0.js",
              triggers: {crons: ["*/5 * * * *"]},
              compatibility_date: "2026-10-02",
              account_id: $account_id,
              d1_databases: [{binding: "DB", database_name: "adriatic-trade-orders-db", database_id: $database_id}],
              r2_buckets: [{binding: "RECEIPTS", bucket_name: "adriatic-trade-receipts"}],
              vars: {TURNSTILE_SITE_KEY: "0x4AAAAAAFEPtKXCu1OUJtJ2"}
            }' > wrangler.deploy.json

      - name: Reject an obsolete main revision before deployment
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: bash scripts/check-worker-release.sh

      - name: Deploy Worker v4.7.2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.deploy.json

      - name: Verify production Worker
        run: |
          for ATTEMPT in 1 2 3 4 5 6; do
            RESPONSE=$(curl --fail-with-body --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "https://adriatic-trade-orders.lakifinance.workers.dev/?deploy=4.7.2-$ATTEMPT")
            printf '%s\n' "$RESPONSE"
            if printf '%s' "$RESPONSE" | jq -e '.ok == true and .version == "4.7.2" and .database == true and .receipts == true and .security == true'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
