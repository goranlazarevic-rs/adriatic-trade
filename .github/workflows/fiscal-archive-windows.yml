name: Fiscal archive Windows checks
on:
  pull_request:
    paths: ['tools/fiscal-archive/**', 'tests/fiscal-archive*', 'worker/adriatic-trade-worker-v4.5.0.js', '.github/workflows/fiscal-archive-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/fiscal-archive.mjs
      - shell: powershell
        run: ./tests/fiscal-archive-windows.ps1
